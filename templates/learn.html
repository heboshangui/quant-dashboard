            <h4>什么是 MACD？</h4>
            <p>MACD（Moving Average Convergence Divergence，平滑异同移动平均线）是由Gerald Appel发明的趋势跟踪指标，由三条线组成：<strong>DIF线</strong>（快线）、<strong>DEA线</strong>（慢线）和<strong>柱状图</strong>（MACD柱）。</p>

            <div class="formula">
DIF = EMA(12日收盘) - EMA(26日收盘)    ← 快线
DEA = EMA(DIF, 9)                       ← 慢线
MACD柱 = (DIF - DEA) × 2               ← 柱状图放大显示
            </div>

RSV = (收盘价 - N日最低价) / (N日最高价 - N日最低价) × 100

D = K的M日简单移动平均
J = 3×K - 2×D

            <div class="formula">
MA5  = 最近5个交易日收盘价之和 / 5     ← 反映短期趋势

MA20 = 最近20个交易日收盘价之和 / 20   ← 反映中长期趋势

            <h4>什么是市盈率（PE）？</h4>
            <p>PE（P/E Ratio，Price-to-Earnings Ratio）是股票估值最常用的指标，表示投资者为获得1元净利润愿意支付的价格。</p>

            <div class="formula">
PE = 当前总市值 / 净利润 = 股价 / 每股收益（EPS）
            </div>

            <p>举例：一股票现价10元，每年每股收益0.5元，则 PE=10/0.5=20，意味着你愿意用20年的回本来持有这只股票。</p>

            <h5>如何用PE判断贵贱？</h5>
            <ul>
                <li>PE &lt; 10：相对便宜（但也要看行业和成长性）</li>
                <li>PE = 10~20：正常区间</li>
                <li>PE = 20~40：偏贵，需要成长性支撑</li>
                <li>PE &gt; 40：偏高，可能是热门题材股</li>
                <li>PE &lt; 0：亏损股，不能用PE估值</li>
            </ul>

            <h4>什么是市净率（PB）？</h4>
            <p>PB（P/B Ratio，Price-to-Book Ratio）是股价与每股净资产的比值，反映的是股票的"清算价值"参考。</p>

            <div class="formula">
PB = 当前总市值 / 净资产 = 股价 / 每股净资产
            </div>

            <h5>如何用PB判断贵贱？</h5>
            <ul>

                <li>PB = 1~3：正常区间</li>
                <li>PB &gt; 5：偏高，通常是成长股或热门股</li>

            <h5>⚠️ 注意事项</h5>

            <p>基本面分析是通过研究公司的<strong>财务数据、经营情况、行业地位</strong>来判断股票的真实价值，与技术分析（看图表）不同。巴菲特就是基本面分析的代表性人物。</p>

            <h4>📊 核心财务指标</h4>

            <h5>1. 净利润</h5>
            <p>公司一年赚了多少钱（扣除所有成本和税之后）。<strong>净利润持续增长</strong>是好公司的标志。注意看"扣非净利润"（扣除一次性收益/损失后的真实利润）。</p>

            <h5>2. 营收（营业收入）</h5>
            <p>公司卖产品/服务一共收了多少钱。营收增速 &gt; 20% 通常被认为成长性较好。营收不增长，利润增长往往难以持续。</p>

            <h5>3. 市值（总市值 / 流通市值）</h5>
            <div class="formula">
总市值 = 股价 × 总股本（所有股份的价值）
流通市值 = 股价 × 流通股本（实际可以买卖的股份价值）
市値大小参考：
  超大盘：&gt;10000亿（如工商银行）
  大盘：500亿~10000亿（如比亚迪）
  中盘：100亿~500亿
  小盘：&lt;100亿
            </div>

            <h5>5. 资产负债率</h5>

            <ul>
                <li>好公司 = 净利润持续增长 = 股价长期向上的基础</li>
                <li>估值低（PE/PB低）= 安全边际，下跌空间有限</li>
                <li>好行业 + 好公司 + 好价格 = 价值投资的"三好学生"</li>
            </ul>

            <h4>⚠️ 注意事项</h4>
            <p>基本面分析是<strong>长线思维</strong>，用好基本面的公司，股价可能3-5年才体现价值。短线交易者更多参考技术面。两者结合使用效果更好！</p>
        `
    }
];

let currentLesson = 0;

function showLesson(idx) {
    currentLesson = idx;
    const lesson = LESSONS[idx];

    // 更新左侧高亮
    document.querySelectorAll('.lesson-card').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
    });

    // 渲染右侧内容
    document.getElementById('lesson-content').innerHTML = `
        <div class="back-btn" onclick="showLesson(${idx === 0 ? LESSONS.length-1 : idx-1})">
            ← 上一课
        </div>
        <div class="back-btn" style="margin-left:8px" onclick="showLesson(${idx === LESSONS.length-1 ? 0 : idx+1})">
            下一课 →
        </div>
        ${lesson.content}
    `;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 默认显示第一课
showLesson(0);
</script>
</body>
</html>
